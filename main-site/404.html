<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="notfound.meta-title">Page not found | OneLink GFTV</title>
    <meta name="description" content="One page for all your links, by Global Furry Television TIDSC." data-i18n-attr="content:meta.description">
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#ffffff">
    <script src="/js/prepaint.js"></script>

    <link rel="preload" href="/assets/fonts/ProximaNova-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/OLG-180.png">

    <!-- Google tag (gtag.js), public pages only -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FMCYFTFPEL"></script>
    <script src="/js/analytics.js"></script>

    <script type="module" src="/assets/i18n/boot.js"></script>
</head>

<body>
    <script src="/js/official-bar.js"></script>

    <header class="site-header">
        <a class="brand" href="/">
            <img data-src="/OLG-192.png" alt="" width="32" height="32">
            <span data-i18n="site.name">OneLink GFTV</span>
        </a>
        <div class="header-actions">
            <div data-language-switcher></div>
            <button class="icon-btn" type="button" id="themeBtn" aria-label="Theme" aria-haspopup="dialog" aria-controls="themeModal">
                <span data-icon="sun"></span>
            </button>
        </div>
    </header>

    <main class="center">
        <section class="glass-card page-card not-found">
            <p class="code" aria-hidden="true">404</p>
            <h1 data-i18n="notfound.title">Page not found uwu</h1>
            <p data-i18n="notfound.body">There is no page at this address. It may have been renamed or deleted, or the link has a typo.</p>
            <div class="actions">
                <a class="btn btn-primary" href="/"><span data-icon="home"></span><span data-i18n="notfound.home">Go home</span></a>
                <a class="btn" href="/register"><span data-icon="plus"></span><span data-i18n="notfound.claim">Make this page yours</span></a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span data-i18n="footer.made">Made with</span> <span data-icon="heart"></span> <span data-i18n="footer.in">in</span>
        <a href="https://www.google.com/maps/place/Singapore" target="_blank" rel="noopener" data-i18n="footer.singapore">Singapore</a>
        <span data-i18n="footer.by">by Global Furry Television</span> &copy; 2014-<span id="currentYear"></span>.
        <span data-i18n="footer.rights">All rights reserved.</span>
    </footer>

    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass-card" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle" data-i18n="theme.title">Theme</h2>
                <button class="icon-btn small" type="button" data-close-modal="themeModal" aria-label="Close" data-i18n-attr="aria-label:common.close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label" data-i18n="theme.mode-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><span data-icon="sun"></span><span data-i18n="theme.mode.light">Light</span></button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false"><span data-icon="moon"></span><span data-i18n="theme.mode.dark">Dark</span></button>
                <button class="mode-btn mode-btn-wide" type="button" data-mode="time" aria-pressed="false"><span data-icon="clock"></span><span data-i18n="theme.mode.time">Time-based</span></button>
            </div>
            <p class="mode-note" id="modeNote" hidden></p>
            <p class="modal-section-label" data-i18n="theme.color-label">Colour theme</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script type="module" src="/js/pages/notfound.js"></script>
</body>

</html>
