<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="login.meta-title">Sign in | OneLink GFTV</title>
    <meta name="description" content="One page for all your links, by Global Furry Television TIDSC." data-i18n-attr="content:meta.description">
    <meta name="robots" content="index">

    <meta name="theme-color" content="#ffffff">
    <script src="/js/prepaint.js"></script>

    <link rel="preload" href="/assets/fonts/ProximaNova-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/OLG-180.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Sign in | OneLink GFTV">
    <meta property="og:site_name" content="OneLink GFTV">
    <meta property="og:description" content="One page for all your links, by Global Furry Television TIDSC.">
    <meta property="og:url" content="https://links.gftv.asia/login">
    <link rel="canonical" href="https://links.gftv.asia/login">
    <meta property="og:image" content="https://links.gftv.asia/OLG-main.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="https://links.gftv.asia/OLG-main.png">

    <script type="module" src="/assets/i18n/boot.js"></script>
</head>

<body>
    <script src="/js/official-bar.js"></script>

    <header class="site-header">
        <a class="brand" href="/">
            <img src="/OLG-192.png" alt="" width="32" height="32">
            <span data-i18n="site.name">OneLink GFTV</span>
        </a>
        <div class="header-actions">
            <div data-language-switcher></div>
            <button class="icon-btn" type="button" id="themeBtn" aria-label="Theme" aria-haspopup="dialog" aria-controls="themeModal">
                <span data-icon="sun"></span>
            </button>
        </div>
    </header>

    <main class="center">
        <section class="glass-card page-card" id="stepPassword">
            <div class="page-head">
                <h1 data-i18n="login.title">Sign in to your page</h1>
                <p data-i18n="login.lede">Enter your page name and password.</p>
            </div>
            <form id="passwordForm" novalidate>
                <div class="field">
                    <label for="slug" data-i18n="field.slug">Page name</label>
                    <div class="slug-input">
                        <span class="slug-host" aria-hidden="true">links.gftv.asia/</span>
                        <input id="slug" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required>
                    </div>
                </div>
                <label class="field">
                    <span data-i18n="field.password">Password</span>
                    <input id="password" type="password" autocomplete="current-password" required>
                </label>
                <div class="callout danger" id="passwordError" role="alert"></div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit" id="passwordSubmit"><span data-i18n="common.continue">Continue</span></button>
                </div>
            </form>
            <p class="muted small u-mt-1 u-center">
                <a class="text-link" href="/reset" data-i18n="login.forgot">Forgot your password?</a>
                &middot;
                <a class="text-link" href="/register" data-i18n="login.create">Create a page</a>
            </p>
        </section>

        <section class="glass-card page-card" id="stepFactor" hidden>
            <div class="page-head">
                <h1 data-i18n="login.factor-title">One more step</h1>
                <p data-i18n="login.factor-lede">Confirm it is you with one of these.</p>
            </div>
            <div class="segmented" role="group" id="methodPicker" aria-label="Second step" data-i18n-attr="aria-label:register.factor-group">
                <button type="button" data-method="totp" aria-pressed="false" hidden><span data-icon="smartphone"></span><span data-i18n="factor.totp">Authenticator app</span></button>
                <button type="button" data-method="passkey" aria-pressed="false" hidden><span data-icon="key"></span><span data-i18n="factor.passkey">Passkey</span></button>
                <button type="button" data-method="telegram" aria-pressed="false" hidden><span data-icon="send"></span><span data-i18n="factor.telegram">Telegram</span></button>
                <button type="button" data-method="backup" aria-pressed="false"><span data-icon="lifebuoy"></span><span data-i18n="factor.backup">Backup code</span></button>
            </div>

            <form id="codeForm" novalidate>
                <p class="small" id="codeHelp"></p>
                <div class="actions" id="telegramSendRow" hidden>
                    <button class="btn" type="button" id="telegramSend"><span data-icon="send"></span><span data-i18n="telegram.send">Send me a code</span></button>
                </div>
                <label class="field u-mt-1" id="codeField">
                    <span id="codeLabel" data-i18n="field.code">Six digit code</span>
                    <input class="code-input" id="code" type="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" required>
                </label>
                <div class="actions" id="passkeyRow" hidden>
                    <button class="btn btn-primary" type="button" id="passkeyUse"><span data-icon="key"></span><span data-i18n="passkey.use">Use my passkey</span></button>
                </div>
                <div class="callout danger" id="codeError" role="alert"></div>
                <div class="actions" id="codeSubmitRow">
                    <button class="btn btn-primary" type="submit" id="codeSubmit"><span data-i18n="login.submit">Sign in</span></button>
                </div>
            </form>
            <p class="muted small u-mt-1 u-center"><button type="button" class="text-link" id="startOver" data-i18n="login.start-over">Start again</button></p>
        </section>
    </main>

    <footer class="site-footer">
        <span data-i18n="footer.made">Made with</span> <span data-icon="heart"></span> <span data-i18n="footer.in">in</span>
        <a href="https://www.google.com/maps/place/Singapore" target="_blank" rel="noopener" data-i18n="footer.singapore">Singapore</a>
        <span data-i18n="footer.by">by Global Furry Television</span> &copy; 2014-<span id="currentYear"></span>.
        <span data-i18n="footer.rights">All rights reserved.</span>
    </footer>

    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass-card" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle" data-i18n="theme.title">Theme</h2>
                <button class="icon-btn small" type="button" data-close-modal="themeModal" aria-label="Close" data-i18n-attr="aria-label:common.close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label" data-i18n="theme.mode-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><span data-icon="sun"></span><span data-i18n="theme.mode.light">Light</span></button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false"><span data-icon="moon"></span><span data-i18n="theme.mode.dark">Dark</span></button>
                <button class="mode-btn mode-btn-wide" type="button" data-mode="time" aria-pressed="false"><span data-icon="clock"></span><span data-i18n="theme.mode.time">Time-based</span></button>
            </div>
            <p class="mode-note" id="modeNote" hidden></p>
            <p class="modal-section-label" data-i18n="theme.color-label">Colour theme</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script type="module" src="/js/pages/login.js"></script>
</body>

</html>
